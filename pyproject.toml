[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runbrief"
version = "0.1.0"
description = "Run a command; keep the full log on disk; print a short tail to the agent."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shurong Cao", email = "170531907+CAOShurong@users.noreply.github.com" }]
keywords = ["ai-agents", "context", "cli", "pytest", "logging"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CAOShurong/runbrief"
Repository = "https://github.com/CAOShurong/runbrief"

[project.scripts]
runbrief = "runbrief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --basetemp=.pytest_tmp"
